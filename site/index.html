<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate</title>
<meta name="description" content="Gate lets Claude Code and Codex hand coding work to a cheaper model, so you spend fewer of their tokens.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237b1e2e'/%3E%3Ccircle cx='10' cy='16' r='5' fill='%23f4ede3'/%3E%3Ccircle cx='23' cy='16' r='4' fill='none' stroke='%23f4ede3' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4ede3; --surface: #fbf7f1; --line: #e2d6c6; --ink: #2b1418; --muted: #7a6a62; --faint: #b3a498;
  --accent: #7b1e2e; --on-accent: #fbf3ea; --soft: #ead9cf; --add: #2f7d4f; --del: #b3261e;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.mono { font-family: var(--mono); }

header, footer { display: flex; align-items: center; justify-content: space-between; padding: 28px 64px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.brand svg { height: 18px; width: auto; fill: var(--accent); }
header nav { display: flex; gap: 28px; font-size: 14px; color: var(--muted); }
header nav a:hover { color: var(--ink); }

/* The slider is a horizontal scroll-snap row, so swipe and trackpad work without script. */
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; min-height: 0; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; display: flex; align-items: center; gap: 72px; padding: 0 64px; min-width: 0; }
.copy { flex: 0 0 560px; max-width: 560px; }
.copy .kicker { font: 13px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin: 0 0 24px; }
h1, h2 { margin: 0 0 24px; font-size: clamp(32px, 3.2vw, 46px); font-weight: 600; line-height: 1.1; letter-spacing: -.035em; }
.copy p { margin: 0 0 24px; font-size: 18px; line-height: 1.6; color: var(--muted); }
.visual { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }

.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 20px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 500; }
.btn:hover { background: #691a27; }
.cmd { display: inline-flex; align-items: center; gap: 10px; padding: 13px 18px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font: 14px var(--mono); }
.cmd span { color: var(--faint); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.label { font: 11px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* 1: hand-off */
.handoff { display: flex; align-items: center; gap: 20px; }
.handoff .card { width: 272px; padding: 24px; }
.handoff h3 { margin: 10px 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.handoff p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
.handoff svg { height: 26px; flex: none; fill: var(--accent); }
.handoff .worker { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.handoff .worker .label, .handoff .worker p { color: var(--soft); }

/* 2: where the work goes */
.bars { display: flex; gap: 40px; align-items: flex-end; }
.bars figure { margin: 0; width: 250px; }
.bar { height: 360px; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.bar div { display: grid; place-items: center; padding: 0 16px; text-align: center; font-size: 13px; font-weight: 500; background: var(--accent); color: var(--on-accent); }
.bar .cheap { background: var(--soft); color: var(--ink); }
.bars figcaption { margin-top: 14px; font-weight: 600; }
.note { font: 12px var(--mono); color: var(--faint); }

/* 3: steps */
.steps { width: min(560px, 100%); list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 18px; padding: 24px; }
.steps li + li { border-top: 1px solid var(--line); }
.steps .n { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--accent); font-size: 15px; font-weight: 600; }
.steps li:nth-child(2) .n { background: var(--accent); color: var(--on-accent); }
.steps h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
.steps p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted); }

/* 4: web view */
.window { width: min(640px, 100%); overflow: hidden; }
.window-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font: 12px var(--mono); color: var(--muted); }
.window-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.window-body { display: flex; }
.chat { flex: 1; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 230px; }
.msg.me { align-self: flex-end; text-align: right; }
.msg b { display: block; margin-bottom: 5px; font: 11px var(--mono); color: var(--muted); }
.msg span { display: block; padding: 9px 12px; border-radius: 12px; background: var(--soft); font-size: 13px; line-height: 1.45; text-align: left; }
.msg.me span { background: var(--accent); color: var(--on-accent); }
.diff { flex: 0 0 290px; border-left: 1px solid var(--line); font: 11px/1.5 var(--mono); }
.diff-head { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
.diff-head span:first-child { flex: 1; }
.diff pre { margin: 0; font: inherit; color: var(--muted); }
.diff pre span { display: block; padding: 4px 14px; white-space: pre; }
.add { color: var(--add); } .del { color: var(--del); }
.diff pre .add { background: rgba(47,125,79,.08); } .diff pre .del { background: rgba(179,38,30,.08); }

/* 5: terminal */
.terminal { width: min(560px, 100%); margin: 0; padding: 28px; border-radius: 16px; background: var(--ink); color: var(--on-accent); font: 15px/1.5 var(--mono); display: grid; gap: 20px; overflow-x: auto; }
.terminal div { display: grid; gap: 6px; }
.terminal small { font-size: 13px; color: #a89088; }
.terminal code { font: inherit; white-space: pre; }
.terminal code::before { content: attr(data-p) "  "; color: #e2a3ad; }

footer .count { font: 13px var(--mono); color: var(--muted); min-width: 80px; }
.dots { display: flex; gap: 8px; align-items: center; }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 4px; background: var(--line); transition: width .25s, background .25s; }
.dots button[aria-current="true"] { width: 28px; background: var(--accent); }
.arrows { display: flex; gap: 10px; }
.arrows button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: none; border: 1px solid var(--line); }
.arrows button:last-child { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.arrows button:disabled { color: var(--faint); background: none; border-color: var(--line); cursor: default; }
.arrows svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Small or short screens: a slide no longer fits one screen, so the page becomes a normal top-to-bottom scroll. */
@media (max-width: 1100px), (max-height: 700px) {
  html, body { height: auto; }
  body { display: block; overflow: visible; }
  header { padding: 20px 24px; position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  footer { display: none; }
  .slides { display: block; overflow: visible; }
  .slide { flex-direction: column; align-items: stretch; gap: 32px; padding: 48px 24px; scroll-margin-top: 72px; }
  .slide + .slide { border-top: 1px solid var(--line); }
  .copy { flex: none; max-width: 640px; }
  .visual { flex: none; align-items: flex-start; }
}
@media (max-width: 640px) {
  .slide { padding: 40px 20px; } header { padding: 16px 20px; }
  h1, h2 { font-size: 30px; } .copy p { font-size: 16px; }
  .steps li { padding: 18px; gap: 14px; } .terminal { padding: 20px; font-size: 13px; }
  .msg { max-width: 85%; }
  .handoff { flex-direction: column; align-items: stretch; } .handoff svg { transform: rotate(90deg); align-self: center; } .handoff .card { width: auto; }
  .bars { gap: 16px; width: 100%; } .bars figure { width: auto; flex: 1; } .bar { height: 260px; }
  .window-body { flex-direction: column; } .diff { flex: none; border-left: 0; border-top: 1px solid var(--line); overflow-x: auto; }
  header nav { gap: 16px; }
}
@media (prefers-reduced-motion: reduce) { .slides { scroll-behavior: auto; } .dots button { transition: none; } }
</style>
</head>
<body>
<noscript>This page needs JavaScript to show the slides.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
